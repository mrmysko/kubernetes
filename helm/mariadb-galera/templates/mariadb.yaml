{{- $mariadbName := include "mariadb.fullname" $ -}}

apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: {{ $mariadbName }}
  labels:
    {{- include "common.labels" $ | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  updateStrategy:
    autoUpdateDataPlane: false # Set this when required for upgrade

  replicas: {{ .Values.app.replicaCount | default 3 }}

  service:
    type: ClusterIP
    sessionAffinity: None

  storage:
    size: 25Gi
    storageClassName: local-storage

  tls:
    enabled: true
    required: false
    serverCertIssuerRef:
      name: cluster-ca
      kind: ClusterIssuer

  {{- if .Values.maxScale }}
  maxScaleRef:
    name: {{ include "maxscale.fullname" $ }}
  {{- end }}

  galera:
    enabled: true
    primary:
      podIndex: 0
      autoFailover: true
    agent:
      kubernetesAuth:
        enabled: true

    config:
      reuseStorageVolume: false
      volumeClaimTemplate:
        resources:
          requests:
            storage: 100Mi
        accessModes:
          - ReadWriteOnce
        storageClassName: local-storage

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  rootPasswordSecretKeyRef:
    name: {{ printf "%s-secret" $mariadbName }}
    key: ROOT_PASSWORD
    generate: false

  metrics:
    enabled: true
    exporter:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    serviceMonitor:
      jobLabel: mariadb-metrics

  myCnf: |
    [mariadb-backup]
    ssl-ca = /etc/pki/ca.crt

    [mysqld]
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci