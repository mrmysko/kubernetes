config:
  machineLearning:
    url: 

machineLearning:
  name: immich
  component: machinelearning
  replicaCount: 1

  image:
    # -- Docker image repository for the application
    repository: ghcr.io/immich-app/immich-machine-learning
    # -- Docker image tag (can be left empty to use the latest version)
    tag: v3-openvino
    pullPolicy: IfNotPresent

  resources:
    requests:
      # -- Minimum CPU resources required by the container
      cpu: "500m"
      # -- Minimum memory resources required by the container
      memory: "512Mi"
    limits:
      # -- Maximum memory resources allowed for the container
      memory: "2Gi"

  service:
    ports: 
    - name: api
      # -- Port exposed by the service
      port: 3003
      # -- Port the container is listening on
      targetPort: 3003
      # -- Protocol used for the service
      protocol: TCP

  securityContext:
    runAsGroup: 1001
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false