apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-ml-model-cache" .Release.Name | quote }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi