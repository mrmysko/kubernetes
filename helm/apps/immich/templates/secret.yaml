apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" .Release.Name | quote }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.mainDb.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}