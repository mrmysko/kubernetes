apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secret" .Release.Name | quote }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    reloader.stakater.com/auto: "true"
type: Opaque
stringData:
  {{- with .Values.mainDb }}
  POSTGRES_USER: {{ .owner | quote }}
  POSTGRES_PASSWORD: {{ .password | quote }}
  POSTGRES_DB: {{ .name | quote }}
  POSTGRES_HOST: {{ .host | quote }}
  POSTGRES_PORT: {{ .port | quote }}
  {{- end }}