{{- $config := .Values.config -}}
{{- $db := .Values.database -}}
{{- $ldap := .Values.config.ldap -}}
{{- $redis := .Values.redis -}}

certificates_directory: '/tmp/certs'
default_2fa_method: 'totp'
theme: 'auto'

authentication_backend:
  refresh_interval: '5m'
  password_reset:
    disable: false
  password_change:
    disable: false

  ldap:
    address: 'ldaps://{{ $ldap.address }}'
    implementation: 'freeipa'
    timeout: '10s'
    start_tls: false
    tls:
      server_name: '{{ $ldap.address }}'
      skip_verify: false
      minimum_version: 'TLS1.2'
      maximum_version: 'TLS1.3'
    base_dn: '{{ $ldap.baseDN }}'
    additional_users_dn: 'cn=users,cn=accounts'
    users_filter: '{{ $ldap.userFilter }}'
    additional_groups_dn: 'cn=groups,cn=accounts'
    groups_filter: '{{ $ldap.groupFilter }}'
    group_search_mode: 'filter'
    permit_referrals: false
    permit_unauthenticated_bind: false
    user: '{{ $ldap.userDN }}'
    attributes:
      distinguished_name: 'distinguishedName'
      username: 'uid'
      display_name: 'displayName'
      family_name: 'sn'
      given_name: 'givenName'
      middle_name: 'middleName'
      phone_number: 'telephoneNumber'
      mail: 'mail'
      member_of: 'memberOf'
      group_name: 'cn'

definitions:
  network:
{{ toYaml $config.network | indent 4 }}

duo_api:
  disable: true

identity_providers:
  oidc:
    jwks:
      - algorithm: 'RS256'
        use: "sig"
        key: |
          {{ `{{ secret "/secrets/OIDC_KEY" | mindent 10 "|" | msquote }}` }}

identity_validation:
  reset_password:
    jwt_lifespan: '5 minutes'
    jwt_algorithm: 'HS256'

log:
  level: 'info'
  format: 'json'
  keep_stdout: 'true'

notifier:
  disable_startup_check: false
  smtp:
    address: '{{ .Values.config.notifier.smtp.address }}'
    timeout: '5s'
    username: '{{ .Values.config.notifier.smtp.username }}'
    sender: '{{ .Values.config.notifier.smtp.sender }}'
    identifier: 'localhost'
    subject: '[Authelia] {title}'
    startup_check_address: '{{ .Values.config.notifier.smtp.startupCheckAddress }}'
    tls:
      server_name: '{{ .Values.config.notifier.smtp.tls.serverName }}'
      skip_verify: true # Fix this

ntp:
  address: '{{ $config.ntp.address }}'
  max_desync: '3s'
  disable_startup_check: false
  disable_failure: false

password_policy:
  zxcvbn:
    enabled: false
    min_score: 3

privacy_policy:
  enabled: true
  require_user_acceptance: true
  policy_url: 'https://i.imgur.com/4GfOIRb.jpeg'

regulation:
  ## The number of failed login attempts before user is banned. Set it to 0 to disable regulation.
  max_retries: 12
  find_time: '2 minutes'
  ban_time: '2 hours'

server:
  address: 'tcp://:9091/'
  # asset_path: '/config/assets/'
  disable_healthcheck: false

  tls:
    certificate: '/tmp/certs/tls.crt'
    key: '/tmp/certs/tls.key'
    # client_certificates: []

  # headers:
  # csp_template: ''

session:
  name: 'auth_cookie'
  same_site: 'lax'
  inactivity: '5m'
  expiration: '1h'
  remember_me: '14d'
  cookies:
{{ toYaml $config.session.cookies | indent 4 }}

  redis:
    host: '{{ include "redis.serviceFQDN" (dict "root" $) }}'
    port: '{{ $redis.port }}'
    username: '{{ $redis.username }}'

storage:
  mysql:
    address: '{{ printf "tcp://%s:%d" $db.host (int64 $db.port) }}'
    database: '{{ $db.name }}'
    username: '{{ $db.username }}'
    timeout: '5s'
    tls:
      server_name: '{{ $db.host }}'
      skip_verify: false
      minimum_version: 'TLS1.2'
      maximum_version: 'TLS1.3'

telemetry:
  metrics:
    enabled: false

totp:
  disable: false
  issuer: 'Invis TOTP'
  algorithm: 'sha1'
  digits: 6
  period: 30
  skew: 1
  secret_size: 32
  disable_reuse_security_policy: false

webauthn:
  disable: false